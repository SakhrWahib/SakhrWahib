<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Madar — All your business in one orbit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5733"/>
      <stop offset="1" stop-color="#E05397"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB199"/>
      <stop offset="0.55" stop-color="#FF5733"/>
      <stop offset="1" stop-color="#E05397"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5733" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5733" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1000" height="230" rx="20"/></clipPath>
    <path id="o1" d="M 75 115 a 95 38 0 1 0 190 0 a 95 38 0 1 0 -190 0"/>
    <path id="o2" d="M 45 115 a 125 58 0 1 1 250 0 a 125 58 0 1 1 -250 0"/>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <rect width="1000" height="230" fill="none" stroke="url(#brand)" stroke-width="2" rx="20" opacity="0.6"/>
    <g fill="#ffffff">
      <circle cx="420" cy="30" r="1.2" opacity="0.5"/><circle cx="560" cy="200" r="1" opacity="0.4"/>
      <circle cx="880" cy="40" r="1.4" opacity="0.5"/><circle cx="960" cy="180" r="1" opacity="0.35"/>
      <circle cx="700" cy="22" r="1" opacity="0.4"/><circle cx="350" cy="190" r="1.2" opacity="0.4"/>
    </g>
    <circle cx="170" cy="115" r="90" fill="url(#glow)"/>
    <g transform="rotate(-18 170 115)">
      <use href="#o1" fill="none" stroke="url(#brand)" stroke-width="1.6" opacity="0.75"/>
      <use href="#o2" fill="none" stroke="#E05397" stroke-width="1.2" opacity="0.45" stroke-dasharray="4 6"/>
      <circle r="6" fill="#FF5733">
        <animateMotion dur="6s" repeatCount="indefinite"><mpath href="#o1"/></animateMotion>
      </circle>
      <circle r="4.5" fill="#E05397">
        <animateMotion dur="9s" repeatCount="indefinite" begin="-3s"><mpath href="#o2"/></animateMotion>
      </circle>
      <circle r="3.5" fill="#FFFFFF">
        <animateMotion dur="9s" repeatCount="indefinite" begin="-7.5s"><mpath href="#o2"/></animateMotion>
      </circle>
    </g>
    <circle cx="170" cy="115" r="26" fill="url(#core)"/>
    <text x="330" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="url(#brand)">Madar</text>
    <text x="545" y="108" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" opacity="0.9">مَدار</text>
    <text x="333" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#C9D1D9">All your business in one orbit</text>
    <text x="333" y="182" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16" fill="#8B949E">Smart platform for appointments, customers &amp; business operations</text>
  </g>
</svg>
